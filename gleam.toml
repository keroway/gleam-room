name = "gleamroom"
# 探索的 MVP 段階のため pre-1.0 表記にしている(#155)。1.0.0 は SemVer の慣習上
# 「安定した公開API/後方互換性のコミットメント」を意味し、現状の実態と矛盾するため。
version = "0.1.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
mist = ">= 6.0.3 and < 7.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
# 参加者 ID を暗号論的乱数で作る（#28）。mist の推移的依存として既に入っていたが、
# 直接使う以上は直接依存として宣言する。
gleam_crypto = ">= 1.6.0 and < 2.0.0"
# actor.call のタイムアウトを rescue するのに使う（#33）。mist の推移的依存として
# 既に入っていたが、直接使う以上は直接依存として宣言する。
exception = ">= 2.1.0 and < 3.0.0"
gleam_otp = ">= 1.1.0 and < 2.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
logging = ">= 1.5.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
# HTTP ルーティングを実際に叩いて確かめるため（#34）。テスト専用。
gleam_httpc = ">= 5.0.0 and < 6.0.0"
# 実 WebSocket ハンドシェイク・フレームの往復を確かめるテストクライアントで使う
# （#158）。mist の推移的依存として既に入っていたが、直接使う以上は直接依存として
# 宣言する。
gramps = ">= 6.0.1 and < 7.0.0"
