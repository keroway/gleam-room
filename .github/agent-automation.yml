# Shared issue-refinement / issue-sprint opt-in for this repository.
enabled: true

# The shared contract processes at most one Issue per cycle.
max_issues_per_cycle: 1

# A merge still requires an explicit caller request. Enabled after issue #1
# (PR #12) was reviewed and merged manually.
allow_merge: true

# 読まれるのは enabled / allow_merge / max_issues_per_cycle の 3 つだけ。
# 以前あった `interval: 30m` は**どのコードからも読まれていなかった**ため外した
# (keroway/agent-assets#184)。実行間隔はここでは決まらない: 横断ループの
# ペースは Claude の利用枠の残量から、cron の起動間隔は launchd の設定から決まる。
