name: osv-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    # 更新手順: keroway/.github の該当ファイルの差分をレビューしたうえで、
    # `gh api repos/keroway/.github/commits/main --jq .sha` で最新 SHA を取得し、
    # 下記 SHA とコメントの日付を同時に更新する（自動更新 bot 非対応のため手動運用）。
    #
    # @main のままだと、共有側の変更が**レビューを経ずに全リポジトリへ即座に効く**。
    uses: keroway/.github/.github/workflows/reusable-osv-scan.yml@f46116661fa12e4ff3911c40970cf0f8510e9823 # 2026-09-09 時点の main
    with:
      # osv-scanner は Gleam(hex) エコシステムに未対応で、実行すると常に
      # `No package sources found`(exit 128)になる（このPRのCIで実測確認済み）。
      # このリポジトリの実依存は gleam.toml/manifest.toml の hex パッケージのみで
      # npm 等スキャン可能な他エコシステムの lockfile は存在しない
      # （node --test の client JS テストは package.json を持たない）ため、
      # opt-in してもスキャン対象の取りこぼしは発生しない。ADR-0028 の懸念
      # （実 lockfile を持つリポジトリでの検知漏れの黙殺）は Gleam/hex 専用の
      # このリポジトリには当てはまらない（keroway/beamsg と同じ位置づけ）。
      #
      # Dependabot security updates はリポジトリ設定で有効化されているが、
      # GitHub の Dependency Graph（SBOM）が gleam.toml/manifest.toml の hex
      # パッケージを検出できないため、実質的に機能していない
      # （`dependabot/alerts` は常に空。#528 で確認・記録）。osv-scanner 同様
      # Hex エコシステムが未対応という同種の制約であり、代替手段は未導入。
      allow-no-package-sources: true
