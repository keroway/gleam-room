name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@dff508cca8ce57162e7aa6c4769a4f97c2fed638 # v1.20.4
        with:
          otp-version: "27"
          gleam-version: "latest"
          rebar3-version: "3"

      - name: Check formatting
        run: gleam format --check src test

      - name: Build
        run: gleam build

      - name: Test
        run: gleam test

      # web.gleam に埋め込まれたクライアント JS の回帰テスト（#61）。
      # docs/mvp.md の MVP 必須機能 "Basic reconnect handling" は Gleam 側からは
      # 検証できないため、Node 標準のテストランナーで駆動する。
      # **新しい依存は入れていない**（package.json も node_modules も無い）。
      # ubuntu-latest には node が入っているので setup-node も要らない。
      - name: Test (client JS)
        run: node --test 'test/client/*.test.mjs'
