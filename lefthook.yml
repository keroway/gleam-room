# keroway 標準 lefthook 設定（https://lefthook.dev/configuration/）
# 導入: `brew install lefthook` && `lefthook install`

pre-commit:
  parallel: true
  jobs:
    - name: gleam format check
      glob: "*.gleam"
      run: gleam format --check {staged_files}
    - name: typos
      # ファイルを直接渡しても _typos.toml の除外を守らせる（#767 の QR 参照行列）。
      run: typos --force-exclude {staged_files}

pre-push:
  jobs:
    - name: just check
      run: just check
